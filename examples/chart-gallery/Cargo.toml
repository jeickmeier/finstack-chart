[package]
name = "chart-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Standalone native chart gallery and capability examples."

[lints]
workspace = true

[dependencies]
serde.workspace = true
chart-core.workspace = true
chart-export.workspace = true
gpui-charts.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-kit = { workspace = true, optional = true }

gpui-charts-kit = { workspace = true, optional = true }

[features]
default = []
performance = ["gpui/profiler"]
kit = ["dep:gpui-charts-kit", "dep:gpui-kit"]

[dev-dependencies]
chart-extension-example.workspace = true
serde_json.workspace = true
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
ttf-parser = "=0.25.1"

[[example]]
name = "capability_spike"
required-features = ["kit"]

[[example]]
name = "finite_benchmark"
required-features = ["performance"]
