name: Workspace

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install development tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
      - name: Check project (native on macOS; headless on Linux)
        run: mise run check
      - name: Test project
        run: mise run test

  portable-runtime:
    name: Actual portable runtimes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.3
      - name: Install proof tools
        shell: bash
        run: |
          set -euo pipefail
          mise install node@24.14.0
          if [[ "$(uname -s)" == "Darwin" ]]; then
            brew install poppler
          else
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          mise exec -- cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Execute Rust, Python and Node WebAssembly fixtures
        run: mise exec node@24.14.0 -- python3 scripts/run_binding_proofs.py artifacts/ci-bindings
