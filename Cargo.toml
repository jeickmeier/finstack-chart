[workspace]
resolver = "3"
members = [
    "crates/chart-core",
    "crates/chart-export",
    "crates/chart-text",
    "crates/gpui-charts",
    "crates/chart-python",
    "crates/chart-wasm",
    "examples/chart-gallery",
    "examples/custom-extension",
]
exclude = ["vendor/proj4rs"]
default-members = ["crates/chart-core", "crates/chart-export", "crates/gpui-charts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
libm = "=0.2.16"
ryu-js = "=1.0.3"
pxfm = "=0.1.30"
proj4rs = { path = "vendor/proj4rs", version = "=0.1.10", default-features = false, features = ["wasm-strict", "esri"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
chart-core = { path = "crates/chart-core" }
chart-extension-example = { path = "examples/custom-extension" }
chart-export = { path = "crates/chart-export" }
chart-text = { path = "crates/chart-text" }
gpui-charts = { path = "crates/gpui-charts" }
gpui = { package = "gpui-pre", version = "=0.3.3", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["font-kit", "runtime_shaders"] }
gpui-kit = { version = "=0.6.0", default-features = false, features = ["component"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
